    evidence: []
  quality:
    maturity: reviewed
    summary: "最小仓库检查已覆盖 required paths、YAML、JSONL、Markdown local links 和 .progress 对象一致性。"
    evidence:
      - docs/05-delivery/17-quality-system-and-risk-management.md
      - scripts/check_repo.py
      - .progress/targets/TS-0004-minimum-docs-and-yaml-checks-working.yaml
      - .progress/evidence/EV-0004-docs-and-yaml-check.yaml
      - .progress/deltas/SDP-0004-docs-and-yaml-check.yaml
