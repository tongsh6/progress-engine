    maturity: accepted
    summary: "v0.1 MVP 边界已冻结为实现前可审查范围，可作为技术栈选择和实现计划依据。"
    evidence:
      - docs/05-delivery/16-mvp-scope-and-roadmap.md
      - .progress/targets/TS-0002-v0.1-mvp-boundary-accepted.yaml
      - .progress/evidence/EV-0002-v0.1-mvp-boundary.yaml
      - .progress/deltas/SDP-0002-v0.1-mvp-boundary.yaml
  design:
