    evidence:
      - docs/03-system-design/14-cli-and-interaction-design.md
  architecture:
    maturity: accepted
    summary: "v0.1 技术栈已选择为 Python 3.11+、stdlib-first CLI、YAML / Markdown / JSONL repo-native 状态账本，并有 ADR 支撑。"
    evidence:
      - docs/03-system-design/06-system-architecture-and-module-boundaries.md
      - decisions/ADR-0001-v0.1-tech-stack.md
      - .progress/targets/TS-0003-v0.1-technical-stack-selected.yaml
