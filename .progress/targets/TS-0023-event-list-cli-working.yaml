id: TS-0023
name: "event list CLI slice working"
primary_dimension: implementation
source_gap: SG-0017
status: accepted
human_gate_required: true
desired_state: "第九条 Python CLI 切片 `progress event list` 可以读取 Change Event 对象目录，并输出只读事件摘要。"
from:
  maturity: drafted
  summary: "`progress event list` 已定义但尚未实现。"
to:
