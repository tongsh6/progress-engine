id: TS-0025
name: "state history CLI slice working"
primary_dimension: implementation
source_gap: SG-0018
status: accepted
human_gate_required: true
desired_state: "第十条 Python CLI 切片 `progress state history` 可以读取 state history JSONL，并输出只读历史摘要。"
from:
  maturity: drafted
  summary: "`progress state history` 已定义但尚未实现。"
to:
  maturity: drafted
  summary: "`progress state history` 作为只读 Python CLI 切片可运行、可测试，证明 State History JSONL 读取路径成立。"
required_evidence:
  - "CLI 支持 `progress state history`。"
  - "命令只读取 `.progress/state/state_history.jsonl`。"
  - "命令读取每条 entry 的最小 history 字段。"
  - "pytest 覆盖成功路径、空文件路径、缺文件路径、malformed JSONL 路径和缺字段路径。"
  - "python3 scripts/check_repo.py 仍通过。"
acceptance_criteria:
  - id: AC-TS-0025-01
    criterion: "`progress state history` 能读取 `.progress/state/state_history.jsonl` 并输出 State History 摘要。"
  - id: AC-TS-0025-02
    criterion: "命令能读取每条 entry 的 `state_version`、`applied_delta`、`applied_at`、`applied_by` 和 `summary`。"
  - id: AC-TS-0025-03
    criterion: "state history 文件缺失时返回 exit code `2` 并输出清晰错误。"
  - id: AC-TS-0025-04
    criterion: "JSONL 解析失败或必要字段缺失时返回 exit code `2` 并输出清晰错误。"
  - id: AC-TS-0025-05
    criterion: "pytest 覆盖成功路径、空文件路径、缺文件路径、malformed JSONL 路径和缺字段路径。"
  - id: AC-TS-0025-06
    criterion: "`python3 scripts/check_repo.py` 仍通过。"
non_goals:
  - "不实现 `progress state refresh`。"
  - "不实现 state replay 或 rollback。"
  - "不实现 Delta apply、模型 API、Web UI 或外部 agent。"
related_gaps:
  - SG-0018
