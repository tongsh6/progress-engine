id: TS-0009
name: "gaps list CLI slice working"
primary_dimension: implementation
source_gap: SG-0007
status: accepted
human_gate_required: true
desired_state: "第二条 Python CLI 切片 `progress gaps list` 可以读取 Project State 中声明的 open gaps，加载对应 gap 对象，并输出只读摘要。"
from:
  maturity: drafted
  summary: "`progress state show` 已可运行、可测试；`progress gaps list` 已定义但尚未被接受为实现成果。"
to:
  maturity: drafted
  summary: "`progress gaps list` 作为只读 Python CLI 切片可运行、可测试，证明对象目录读取路径成立。"
required_evidence:
  - "CLI 支持 `progress gaps list`。"
  - "命令只读取 Project State 和 `.progress/gaps/*.yaml`。"
  - "pytest 覆盖成功路径、缺 gap 文件路径、malformed gap 路径和缺必填字段路径。"
  - "python3 scripts/check_repo.py 仍通过。"
acceptance_criteria:
  - id: AC-TS-0009-01
    criterion: "`progress gaps list` 能读取 Project State 的 `open_state_gaps` 并输出对应 gap 摘要。"
  - id: AC-TS-0009-02
    criterion: "命令只列出 Project State 中声明的 open gaps，不扫描输出已 resolved gap。"
  - id: AC-TS-0009-03
    criterion: "缺少 gap 文件时返回 exit code `2` 并输出清晰错误。"
  - id: AC-TS-0009-04
    criterion: "gap YAML 解析失败或必要字段缺失时返回 exit code `2` 并输出清晰错误。"
  - id: AC-TS-0009-05
    criterion: "pytest 覆盖成功路径、缺 gap 文件路径和 malformed gap 路径。"
  - id: AC-TS-0009-06
    criterion: "`python3 scripts/check_repo.py` 仍通过。"
non_goals:
  - "不实现 `progress gaps show`。"
  - "不实现 gap create / update / close。"
  - "不实现 target suggest、delta apply 或自动关闭 gap。"
  - "不接入模型 API、Web UI 或外部 agent。"
related_gaps:
  - SG-0007
