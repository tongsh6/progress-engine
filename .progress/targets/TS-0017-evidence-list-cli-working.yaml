    criterion: "Evidence YAML 解析失败、缺少根 mapping 或必要字段缺失时返回 exit code `2` 并输出清晰错误。"
  - id: AC-TS-0017-05
    criterion: "pytest 覆盖成功路径、空目录路径、缺目录路径、malformed YAML 路径和缺字段路径。"
  - id: AC-TS-0017-06
    criterion: "`python3 scripts/check_repo.py` 仍通过。"
non_goals:
