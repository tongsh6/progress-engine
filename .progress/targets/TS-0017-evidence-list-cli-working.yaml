id: TS-0017
name: "evidence list CLI slice working"
primary_dimension: implementation
source_gap: SG-0014
status: accepted
human_gate_required: true
desired_state: "第六条 Python CLI 切片 `progress evidence list` 可以读取 Evidence 对象目录，并输出只读 Evidence 摘要。"
from:
  maturity: drafted
  summary: "`progress evidence list` 已定义但尚未实现。"
