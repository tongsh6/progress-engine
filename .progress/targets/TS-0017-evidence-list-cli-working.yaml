  - id: AC-TS-0017-02
    criterion: "命令能读取 `evidence` 根 mapping 下的 Evidence 字段。"
  - id: AC-TS-0017-03
    criterion: "evidence 目录缺失时返回 exit code `2` 并输出清晰错误。"
