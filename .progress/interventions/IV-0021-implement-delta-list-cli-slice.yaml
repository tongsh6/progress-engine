id: IV-0021
name: "Implement read-only delta list CLI slice"
primary_dimension: implementation
target_state_id: TS-0021
status: completed
goal: "只实现 `progress delta list` 这一条只读 Python CLI 用户路径，验证 State Delta Proposal 目录读取路径。"
in_scope:
  - "扩展 argparse 命令 `progress delta list`"
  - "读取 `.progress/deltas/*.yaml`"
  - "读取 `state_delta_proposal` 根 mapping 下的最小 proposal 字段和 acceptance summary"
  - "输出 State Delta Proposal 摘要"
  - "为成功路径、空目录路径、缺目录路径、malformed YAML 路径、缺根 mapping 路径和缺字段路径添加 pytest"
out_of_scope:
  - "不实现 progress delta apply"
  - "不实现 progress delta reject"
  - "不实现 progress delta rollback"
  - "不写入 Project State 或 state history"
  - "不实现模型 API、Web UI 或外部 agent"
evidence_required:
  - "python3 -m pytest 通过"
  - "python3 scripts/check_repo.py 通过"
  - "PYTHONPATH=src python3 -m progress_engine delta list 输出 State Delta Proposal 摘要"
automation_policy: human_gate_required
