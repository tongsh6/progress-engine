id: IV-0009
name: "Implement read-only gaps list CLI slice"
primary_dimension: implementation
target_state_id: TS-0009
status: completed
goal: "只实现 `progress gaps list` 这一条只读 Python CLI 用户路径，验证最小 State Gap 对象目录读取路径。"
in_scope:
  - "在 argparse 中新增 `progress gaps list`"
  - "读取 Project State 的 `open_state_gaps`"
  - "读取对应 `.progress/gaps/*.yaml` gap 对象"
  - "输出 gap id、dimension 和 desired_state 摘要"
  - "为成功路径、缺 gap 文件、malformed gap 和缺必填字段添加 pytest"
out_of_scope:
  - "不实现 `progress gaps show`"
  - "不实现 gap create / update / close"
  - "不实现 target suggest、delta apply 或自动关闭 gap"
  - "不修改命令运行时的 .progress 状态账本"
  - "不接入模型 API、Web UI 或外部 agent"
evidence_required:
  - "python3 -m pytest 通过"
  - "python3 scripts/check_repo.py 通过"
  - "PYTHONPATH=src python3 -m progress_engine gaps list 输出当前 open gaps 摘要"
automation_policy: human_gate_required
