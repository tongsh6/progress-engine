  - "不运行 verification"
  - "不生成 State Delta Proposal 的 CLI 命令"
  - "不实现 delta apply、模型 API、Web UI 或外部 agent"
evidence_required:
  - "python3 -m pytest 通过"
  - "python3 scripts/check_repo.py 通过"
  - "PYTHONPATH=src python3 -m progress_engine evidence list 输出 Evidence 摘要"
automation_policy: human_gate_required
